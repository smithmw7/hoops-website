<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Corgi Cafe — Coming Soon from Hightop Games." />
  <title>Corgi Cafe — Coming Soon</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #4a2800;
      --text-light: rgba(74, 40, 0, 0.7);
      --accent: #d4740e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0 0 clamp(24px, 5vw, 48px) 0;
      background: linear-gradient(180deg, #f5b942 0%, #f0a030 30%, #e89428 55%, #f5c44a 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .glow {
      position: fixed;
      top: 40%;
      left: 50%;
      width: 120vw;
      height: 80vh;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(255, 240, 180, 0.65) 0%, rgba(255, 220, 120, 0.25) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(40px, 8vw, 72px) clamp(24px, 5vw, 48px) 0;
      width: 100%;
      flex: 1;
    }

    .icon-scene {
      position: relative;
      width: min(280px, 65vw);
      margin-bottom: clamp(24px, 4vw, 40px);
    }

    .icon-scene .app-icon {
      width: 100%;
      height: auto;
      border-radius: 22.37%;
      display: block;
      filter: drop-shadow(6px 10px 24px rgba(120, 60, 0, 0.35));
    }

    .icon-scene .dog-img {
      position: absolute;
      bottom: -12%;
      right: -18%;
      width: 55%;
      height: auto;
      filter: drop-shadow(4px 6px 16px rgba(80, 40, 0, 0.3));
      z-index: 2;
    }

    .title {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 0.4em;
      text-shadow: 0 2px 8px rgba(245, 196, 74, 0.5);
    }

    .coming-soon {
      display: inline-block;
      padding: 0.6rem 2rem;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    footer {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      margin-top: auto;
      padding: 28px clamp(24px, 5vw, 48px) 0;
      border-top: 1px solid rgba(74, 40, 0, 0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copy {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="hero">
    <div class="icon-scene">
      <img src="../assets/images/CorgiCafeIcon.png" alt="Corgi Cafe App Icon" class="app-icon" />
      <img src="../assets/images/dog_1.png" alt="Corgi character" class="dog-img" />
    </div>
    <h1 class="title">Corgi Cafe</h1>
    <span class="coming-soon">Coming Soon</span>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="../index.html">Home</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Hightop Games LLC. All rights reserved.</p>
  </footer>
</body>
</html>
