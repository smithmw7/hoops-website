<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hightop Games</title>
  <meta name="description" content="Hightop Games LLC. Play Daily Reword, Aces, Corgi Cafe and more.">
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 1rem;
    }
    .logo-wrap img {
      max-width: min(320px, 85vw);
      height: auto;
      display: block;
      filter: drop-shadow(6px 8px 16px rgba(180, 168, 155, 0.55));
    }
    .games-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2.5rem;
      padding: 1rem 0 2.5rem;
      max-width: 800px;
      width: 100%;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      transition: transform 0.2s ease;
      width: min(180px, 40vw);
    }
    .game-card:hover {
      transform: translateY(-3px);
    }
    .app-icon {
      width: 100%;
      height: auto;
      border-radius: 22.37%;
      filter: drop-shadow(4px 6px 14px rgba(80, 80, 120, 0.35));
    }
    .game-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.8rem;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.4);
      transition: filter 0.2s ease;
    }
    .game-card:hover .game-pill {
      filter: brightness(1.15);
    }
    @media (max-width: 600px) {
      .games-grid {
        gap: 1.5rem 1.25rem;
      }
      .game-card {
        width: min(140px, 38vw);
        gap: 0.7rem;
      }
      .game-pill {
        padding: 0.5rem 1.4rem;
        font-size: 0.85rem;
      }
    }
    .legal {
      flex-shrink: 0;
      text-align: center;
      font-size: 0.8rem;
      color: #8a8278;
      margin-top: auto;
    }
    .legal a {
      color: #8a8278;
      text-decoration: underline;
    }
    .legal a:hover { color: #5a534a; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="assets/images/LogoHightopGames.png" alt="Hightop Games" width="320" height="auto" />
  </div>

  <section class="games-grid">
    <a href="reword/index.html" class="game-card">
      <img src="assets/images/DailyRewordIcon.png" alt="Daily Reword App Icon" class="app-icon" />
      <span class="game-pill">Daily Reword</span>
    </a>
    <a href="aces/index.html" class="game-card">
      <img src="assets/images/AcesIcon.png" alt="Aces App Icon" class="app-icon" />
      <span class="game-pill">Aces</span>
    </a>
    <a href="corgicafe/index.html" class="game-card">
      <img src="assets/images/CorgiCafeIcon.png" alt="Corgi Cafe App Icon" class="app-icon" />
      <span class="game-pill">Corgi Cafe</span>
    </a>
  </section>

  <footer class="legal">
    <p>Hightop Games LLC &copy; 2026</p>
    <p><a href="reword/index.html">Daily Reword</a> &middot; <a href="aces/index.html">Aces</a> &middot; <a href="corgicafe/index.html">Corgi Cafe</a></p>
    <p><a href="reword/privacy.html">Privacy Policy</a> &middot; <a href="reword/terms.html">Terms of Service</a></p>
  </footer>
</body>
</html>
