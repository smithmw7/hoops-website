<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a1e">
  <title>Color Rise · Wordmark</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="wordmark.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #191a1e; padding: 32px; }
    .color-rise-logo { --logo-size: clamp(64px, 22vw, 120px); }
  </style>
</head>
<body>
  <div class="color-rise-logo" role="img" aria-label="Color Rise">
    <span class="color-rise-logo__color" aria-hidden="true">COLOR</span>
    <span class="color-rise-logo__rise" aria-hidden="true">RISE</span>
  </div>
</body>
</html>
