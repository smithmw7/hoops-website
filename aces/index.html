<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aces — Merge cards. Build your deck. A card merge game from Hightop Games." />
  <title>Aces — Card Merge Game</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.75);
      --accent: #b0d0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1629 url('assets/shadow.png') center center / cover no-repeat fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0 0 clamp(24px, 5vw, 48px) 0;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(32px, 8vw, 56px) clamp(24px, 5vw, 48px) clamp(24px, 5vw, 48px);
      width: 100%;
      flex: 1;
    }

    .logo-wordmark {
      font-family: 'Arvo', serif;
      font-size: clamp(2.75rem, 12vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.28em;
      line-height: 1.1;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: clamp(20px, 4vw, 32px);
      text-shadow: 0 0 12px rgba(59, 130, 246, 0.5), 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .cards-image {
      width: 100%;
      max-width: min(420px, 90vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4));
      margin-bottom: clamp(20px, 4vw, 28px);
    }

    .tagline {
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 600;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
    }

    /* Download section */
    .download-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px) 0;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .download-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 4vw, 1.5rem);
    }
    .download-app-icon {
      width: min(120px, 28vw);
      height: auto;
      border-radius: 22.37%;
      filter: drop-shadow(4px 6px 14px rgba(80, 80, 120, 0.3));
      flex-shrink: 0;
    }
    .app-store-badge {
      height: 64px;
      width: auto;
      transition: opacity 0.2s ease;
    }
    .app-store-badge:hover {
      opacity: 0.8;
    }

    footer {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      margin-top: auto;
      padding: 28px clamp(24px, 5vw, 48px) 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      background: transparent;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copy {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1 class="logo-wordmark">Aces</h1>
    <img src="assets/cards.png" alt="Four aces — clubs, diamonds, spades, hearts" class="cards-image" width="420" height="auto" />
    <p class="tagline">Merge cards to reach Aces.</p>
  </main>

  <section class="download-section">
    <div class="download-top-row">
      <img src="../assets/images/AcesIcon.png" alt="Aces - Official Card Puzzle App Icon" class="download-app-icon" />
      <a href="https://apps.apple.com/us/app/aces-official-card-puzzle/id6759623356" target="_blank" rel="noopener">
        <img
          src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&amp;releaseDate=1736899200"
          alt="Download on the App Store"
          class="app-store-badge"
        />
      </a>
    </div>
  </section>

  <footer>
    <nav class="footer-links">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms of Service</a>
    </nav>
    <p class="footer-copy">© 2026 Hightop Games LLC. All rights reserved.</p>
  </footer>
</body>
</html>
