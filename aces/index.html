<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aces — Merge cards. Build your deck. A card merge game from Hightop Games." />
  <title>Aces — Card Merge Game</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f0e0;
      --bg-soft: #d4e8c8;
      --text: #1a2e14;
      --text-muted: #3d4a36;
      --accent: #2d6a22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0 0 clamp(24px, 5vw, 48px) 0;
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(48px, 10vw, 80px) clamp(24px, 5vw, 48px) 0;
      width: 100%;
      flex: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      left: 50%;
      margin-left: -50vw;
      width: 100vw;
      top: 0;
      bottom: 0;
      background: var(--bg-soft);
      z-index: -1;
    }

    .logo-wordmark {
      font-size: clamp(3rem, 14vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: clamp(16px, 3vw, 24px);
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 600;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.45;
    }

    footer {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      margin-top: auto;
      padding: 32px clamp(24px, 5vw, 48px) 0;
      border-top: 1px solid rgba(26, 46, 20, 0.08);
      text-align: center;
      background: var(--bg);
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copy {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1 class="logo-wordmark">Aces</h1>
    <p class="tagline">Merge cards. Build your deck.</p>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms of Service</a>
    </nav>
    <p class="footer-copy">© 2026 Hightop Games LLC. All rights reserved.</p>
  </footer>
</body>
</html>
