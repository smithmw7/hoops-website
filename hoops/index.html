<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hightop Hoops — Coming Soon from Hightop Games." />
  <title>Hightop Hoops — Coming Soon</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #eaf2ff;
      --text-light: rgba(234, 242, 255, 0.65);
      --accent: #7cc4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0 0 clamp(24px, 5vw, 48px) 0;
      /* Same backdrop as the in-game shoebox reveal (src/boxreveal/boxreveal.css) */
      background: radial-gradient(120% 90% at 50% 18%, #3fa9f5 0%, #1565d8 42%, #0b2e8a 78%, #051a52 100%);
      background-attachment: fixed;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Rotating ray burst, behind everything */
    .rays {
      position: fixed;
      width: 160vmin;
      height: 160vmin;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(rgba(255, 255, 255, 0.06) 0deg 9deg, transparent 9deg 24deg);
      border-radius: 50%;
      mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 62%);
      -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 62%);
      animation: spin 22s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Diagonal light sweep */
    .sheen {
      position: fixed;
      inset: -20%;
      background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.07) 50%, transparent 60%);
      animation: sheen 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes sheen {
      0%, 100% { transform: translateX(-12%); }
      50% { transform: translateX(12%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rays, .sheen { animation: none; }
    }

    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(40px, 8vw, 72px) clamp(24px, 5vw, 48px) 0;
      width: 100%;
      flex: 1;
    }

    .icon-shell {
      width: min(200px, 46vw);
      aspect-ratio: 1 / 1;
      border-radius: 22.37%;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(3, 14, 46, 0.55);
      margin-bottom: clamp(28px, 5vw, 44px);
    }

    .icon-shell img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .wordmark {
      width: min(420px, 82vw);
      height: auto;
      display: block;
      margin-bottom: clamp(24px, 4vw, 36px);
      filter: drop-shadow(0 6px 22px rgba(3, 14, 46, 0.6));
    }

    .coming-soon {
      display: inline-block;
      padding: 0.6rem 2rem;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    footer {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      margin-top: auto;
      padding: 28px clamp(24px, 5vw, 48px) 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copy {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <div class="rays"></div>
  <div class="sheen"></div>

  <main class="hero">
    <div class="icon-shell">
      <img src="../assets/images/HightopHoopsIcon.png" alt="Hightop Hoops App Icon" />
    </div>
    <img src="../assets/images/LogoHightopHoops.png" alt="Hightop Hoops" class="wordmark" />
    <span class="coming-soon">Coming Soon</span>
  </main>

  <footer>
    <nav class="footer-links">
      <a href="../index.html">Home</a>
      <a href="../support.html">Support</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Hightop Games LLC. All rights reserved.</p>
  </footer>
</body>
</html>
